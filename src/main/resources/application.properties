# =====================================================================
# Base configuration shared by all profiles.
# Secrets are NEVER stored here: they are read from environment variables.
# =====================================================================
spring.application.name=library-ms
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}

# --- Datasource (credentials from env) --------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/libraryms}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA: schema is owned by Flyway; Hibernate only validates ---------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- Flyway ------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Actuator ----------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}

# --- Error output: never leak internals -------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# --- Jackson ------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Security & JWT ----------------------------------------------------
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration-seconds=${JWT_ACCESS_EXPIRATION:900}
jwt.refresh-token-expiration-seconds=${JWT_REFRESH_EXPIRATION:604800}

# --- CORS --------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Admin Bootstrap ---------------------------------------------------
app.bootstrap.admin.username=${ADMIN_USERNAME:}
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}

