# =====================================================================
# Development profile (default when no profile is active).
# Credentials still come from env vars (see .env.example).
# =====================================================================
logging.level.com.libraryms=DEBUG
logging.level.org.hibernate.SQL=INFO
management.endpoint.health.show-details=always

# Local development defaults for running directly from IDE
spring.datasource.username=${DB_USERNAME:libraryms}
spring.datasource.password=${DB_PASSWORD:libraryms}
jwt.secret=${JWT_SECRET:local-development-secret-jwt-key-must-be-at-least-32-bytes!}
